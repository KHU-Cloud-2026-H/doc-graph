name: API Types Drift

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:types
      - name: Verify schema.ts is up-to-date with openapi.json
        run: |
          if ! git diff --exit-code packages/api-types/src/schema.ts; then
            echo "::error::schema.ts is out of sync with openapi.json. Run 'just gen-types' and commit the result." >&2
            exit 1
          fi